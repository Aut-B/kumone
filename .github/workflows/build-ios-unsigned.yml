name: Build unsigned iOS IPA

on:
  push:
    branches: ["dev-musicfree", "dev-musicfree-0.3.17", "dev-musicfree-0.3.19", "dev-musicfree-0.3.20", "dev-musicfree-0.3.20-ios15", "dev-musicfree-0.3.21", "dev-musicfree-0.3.21-ios15", "dev-musicfree-0.3.24", "dev-musicfree-0.3.24-ios15", "dev-musicfree-0.3.37-ios15", "feat/douyin-ios15", "feat/douyin-ios15-0.3.37"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    # macos-26 is arm64 and kept failing to acquire a hosted runner at 0 steps
    # (capacity). macos-15-intel is x64 and carries Xcode 16 / iOS 18 SDK, which
    # covers every API this branch gates behind #available(iOS 18).
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEPLOY_TARGET: ${{ (contains(github.ref_name, 'ios15') || contains(github.ref_name, 'douyin')) && '15.0' || '16.0' }}
      BUILD_NUM: ${{ contains(github.ref_name, '0.3.37') && '370' || (contains(github.ref_name, 'douyin') && '194' || (endsWith(github.ref_name, '-ios15') && (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '174' || '164') || (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '173' || '163'))) }}
      MARKETING: ${{ contains(github.ref_name, '0.3.37') && '0.3.37' || (contains(github.ref_name, 'douyin') && '0.3.24' || (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '0.3.24' || (startsWith(github.ref_name, 'dev-musicfree-0.3.21') && '0.3.21' || '0.3.20'))) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify iOS search UI invariants
        run: python3 Scripts/verify-ios-search-ui.py

      - name: Test iOS search UI
        continue-on-error: true
        run: bash Scripts/test-ios-search-ui.sh

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Expose compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|fatal error):" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/Kumone-iOS-plugins.ipa" Payload)
          ls -la Kumone-iOS-plugins.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-iOS-plugins-unsigned
          path: Kumone-iOS-plugins.ipa
          retention-days: 14

      - name: Publish dev release (IPA visible on Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: Dev 构建 #${{ github.run_number }}
          body: 自动化开发构建（插件音源版）。下载 Kumone-iOS-plugins.ipa 导入 LiveContainer。
          files: Kumone-iOS-plugins.ipa
          prerelease: true
          fail_on_unmatched_files: true
