name: Build unsigned iOS IPA

on:
  push:
    branches: ["dev-musicfree", "dev-musicfree-0.3.17", "dev-musicfree-0.3.19", "dev-musicfree-0.3.20", "dev-musicfree-0.3.20-ios15", "dev-musicfree-0.3.21", "dev-musicfree-0.3.21-ios15", "dev-musicfree-0.3.24", "dev-musicfree-0.3.24-ios15", "feat/douyin-ios15"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEPLOY_TARGET: ${{ endsWith(github.ref_name, '-ios15') && '15.0' || '16.0' }}
      BUILD_NUM: ${{ contains(github.ref_name, 'douyin') && '194' || (endsWith(github.ref_name, '-ios15') && (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '174' || '164') || (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '173' || '163')) }}
      MARKETING: ${{ contains(github.ref_name, 'douyin') && '0.3.24' || (startsWith(github.ref_name, 'dev-musicfree-0.3.24') && '0.3.24' || (startsWith(github.ref_name, 'dev-musicfree-0.3.21') && '0.3.21' || '0.3.20')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify iOS search UI invariants
        run: python3 Scripts/verify-ios-search-ui.py

      - name: Test iOS search UI
        run: |
          set -euo pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
import json, re, sys
data = json.load(sys.stdin)
candidates = []
for runtime, devices in data["devices"].items():
    version_match = re.search(r"(\d+)-(\d+)", runtime)
    version = tuple(map(int, version_match.groups())) if version_match else (0, 0)
    for device in devices:
        name = device.get("name", "")
        if device.get("isAvailable") and "iPhone" in name:
            score = (1 if "Pro Max" in name else 0, version, name)
            candidates.append((score, device["udid"], name))
if not candidates:
    sys.exit("No available iPhone simulator")
score, sim_udid, sim_name = max(candidates, key=lambda item: item[0])
print(sim_udid)
')
          echo "Using iPhone simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/search-ui-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            test

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING" CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/Kumone-iOS-plugins.ipa" Payload)
          ls -la Kumone-iOS-plugins.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-iOS-plugins-unsigned
          path: Kumone-iOS-plugins.ipa
          retention-days: 14

      - name: Publish dev release (IPA visible on Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: Dev 构建 #${{ github.run_number }}
          body: 自动化开发构建（插件音源版）。下载 Kumone-iOS-plugins.ipa 导入 LiveContainer。
          files: Kumone-iOS-plugins.ipa
          prerelease: true
          fail_on_unmatched_files: true
