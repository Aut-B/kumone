<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1601px;height:890px;background:#FFFFFF;" width="1601px" height="890px" viewBox="0 0 1601 890" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="748" y="22.995" fill="#000" font-size="14" textLength="98" font-weight="700" font-family="PingFang SC">连接授权与恢复</text></g><g class="entity" data-qualified-name="Disconnected" id="ent0001" data-source-line="6"><rect x="1320.5" y="110.297" width="147.244" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1320.5" y1="152.891" x2="1467.744" y2="152.891" style="stroke:#181818;stroke-width:0.5;"/><text x="1330.5" y="128.292" fill="#000" font-size="14" textLength="42" font-family="PingFang SC">未连接</text><text x="1330.5" y="144.589" fill="#000" font-size="14" textLength="127.244" font-family="PingFang SC">connected = false</text></g><g class="entity" data-qualified-name="Connecting" id="ent0002" data-source-line="7"><rect x="972" y="264.797" width="172.496" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="972" y1="307.391" x2="1144.496" y2="307.391" style="stroke:#181818;stroke-width:0.5;"/><text x="982" y="282.792" fill="#000" font-size="14" textLength="56" font-family="PingFang SC">建立连接</text><text x="982" y="299.089" fill="#000" font-size="14" textLength="152.496" font-family="PingFang SC">捕获新的 connectionID</text></g><g class="entity" data-qualified-name="Picker" id="ent0003" data-source-line="8"><rect x="1259.5" y="465.797" width="148.584" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1259.5" y1="508.391" x2="1408.084" y2="508.391" style="stroke:#181818;stroke-width:0.5;"/><text x="1269.5" y="483.792" fill="#000" font-size="14" textLength="112" font-family="PingFang SC">等待用户授权目录</text><text x="1269.5" y="500.089" fill="#000" font-size="14" textLength="128.584" font-family="PingFang SC">enable() 返回 false</text></g><g class="entity" data-qualified-name="Connected" id="ent0004" data-source-line="9"><rect x="6" y="465.797" width="261.992" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="6" y1="508.391" x2="267.992" y2="508.391" style="stroke:#181818;stroke-width:0.5;"/><text x="16" y="483.792" fill="#000" font-size="14" textLength="56" font-family="PingFang SC">连接有效</text><text x="16" y="500.089" fill="#000" font-size="14" textLength="241.992" font-family="PingFang SC">enabled = true / connected = true</text></g><g class="entity" data-qualified-name="Failed" id="ent0005" data-source-line="10"><rect x="632.5" y="620.297" width="216.861" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="632.5" y1="679.188" x2="849.361" y2="679.188" style="stroke:#181818;stroke-width:0.5;"/><text x="642.5" y="638.292" fill="#000" font-size="14" textLength="70" font-family="PingFang SC">故障待恢复</text><text x="642.5" y="654.589" fill="#000" font-size="14" textLength="196.861" font-family="PingFang SC">connected = false / 展示错误</text><text x="642.5" y="670.886" fill="#000" font-size="14" textLength="144.792" font-family="PingFang SC">enabled 保留当前意愿</text></g><g class="entity" data-qualified-name="Disabled" id="ent0006" data-source-line="11"><rect x="605.5" y="744.297" width="271.139" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="605.5" y1="786.891" x2="876.639" y2="786.891" style="stroke:#181818;stroke-width:0.5;"/><text x="615.5" y="762.292" fill="#000" font-size="14" textLength="56" font-family="PingFang SC">明确关闭</text><text x="615.5" y="778.589" fill="#000" font-size="14" textLength="251.139" font-family="PingFang SC">enabled = false / connected = false</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="13"><ellipse cx="1394" cy="59.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="31"><path d="M1162.5,218.297 L1162.5,287.297 L1144.219,291.297 L1162.5,295.297 L1162.5,364.492 A0,0 0 0 0 1162.5,364.492 L1449.232,364.492 A0,0 0 0 0 1449.232,364.492 L1449.232,228.297 L1439.232,218.297 L1162.5,218.297 A0,0 0 0 0 1162.5,218.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1439.232,218.297 L1439.232,228.297 L1449.232,228.297 L1439.232,218.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1168.5" y="235.364" fill="#000" font-size="13" textLength="219.737" font-family="PingFang SC">新连接前先 invalidateConnection：</text><text x="1168.5" y="250.497" fill="#000" font-size="13" textLength="249.139" font-family="PingFang SC">1. 换 connectionID，清空远端列表和待办</text><text x="1168.5" y="265.629" fill="#000" font-size="13" textLength="171.825" font-family="PingFang SC">2. 取消合并 / 执行 / 周期任务</text><text x="1168.5" y="280.762" fill="#000" font-size="13" textLength="159.536" font-family="PingFang SC">3. 失效接续请求与发布基线</text><text x="1168.5" y="295.895" fill="#000" font-size="13" textLength="120.536" font-family="PingFang SC">4. 断开上一仓储连接</text><text x="1168.5" y="311.028" fill="#000" font-size="13" font-family="PingFang SC"> </text><text x="1168.5" y="326.161" fill="#000" font-size="13" textLength="265.732" font-family="PingFang SC">enable：有书签 → restore；否则尝试容器。</text><text x="1168.5" y="341.293" fill="#000" font-size="13" textLength="243.706" font-family="PingFang SC">connect：手选根或其下 Kumone 目录。</text><text x="1168.5" y="356.426" fill="#000" font-size="13" textLength="219.642" font-family="PingFang SC">restore 不重建已被删除的授权目录。</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="42"><path d="M425.5,434.297 L425.5,488.297 L268.242,492.297 L425.5,496.297 L425.5,550.227 A0,0 0 0 0 425.5,550.227 L704.786,550.227 A0,0 0 0 0 704.786,550.227 L704.786,444.297 L694.786,434.297 L425.5,434.297 A0,0 0 0 0 425.5,434.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M694.786,434.297 L694.786,444.297 L704.786,444.297 L694.786,434.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="431.5" y="451.364" fill="#000" font-size="13" textLength="258.286" font-family="PingFang SC">手选 / restore 入口各开启一次安全作用域，</text><text x="431.5" y="466.497" fill="#000" font-size="13" textLength="241.586" font-family="PingFang SC">成功后由 repository.scopedURL 持有。</text><text x="431.5" y="481.629" fill="#000" font-size="13" textLength="234" font-family="PingFang SC">原生容器不需要手选目录的安全作用域。</text><text x="431.5" y="496.762" fill="#000" font-size="13" textLength="187.104" font-family="PingFang SC">disconnect / 入口失败时释放。</text><text x="431.5" y="511.895" fill="#000" font-size="13" font-family="PingFang SC"> </text><text x="431.5" y="527.028" fill="#000" font-size="13" textLength="199.539" font-family="PingFang SC">每次 await 后检查操作所属连接，</text><text x="431.5" y="542.161" fill="#000" font-size="13" textLength="234" font-family="PingFang SC">过期操作不能激活或清空替换后的连接。</text></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="51"><path d="M573,834.297 L573,874.563 A0,0 0 0 0 573,874.563 L908.73,874.563 A0,0 0 0 0 908.73,874.563 L908.73,844.297 L898.73,834.297 L745,834.297 L741,797.584 L737,834.297 L573,834.297 A0,0 0 0 0 573,834.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M898.73,834.297 L898.73,844.297 L908.73,844.297 L898.73,834.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="579" y="851.364" fill="#000" font-size="13" textLength="314.73" font-family="PingFang SC">普通 disable 不撤回全部云端文件，不远程注销账号。</text><text x="579" y="866.497" fill="#000" font-size="13" textLength="260" font-family="PingFang SC">本机账号、播放恢复和已保存偏好继续存在。</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-link-type="dependency"><polygon points="1394,110.182,1398,101.182,1394,105.182,1390,101.182,1394,110.182" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1394,73.46 C1394,83.178 1394,92.636 1394,105.182" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="1086.68,264.61,1096.147,261.896,1090.512,261.399,1091.009,255.764,1086.68,264.61" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1320.299,155.677 C1271.238,169.18 1206.257,190.201 1153,218.297 C1129.022,230.947 1108.54,246.293 1090.512,261.399" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1239" y="195.364" fill="#000" font-size="13" textLength="160.532" font-family="PingFang SC">enable / connect（手选）</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="1069.089,318.118,1068.698,327.959,1070.937,322.764,1076.132,325.003,1069.089,318.118" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M876.78,754.25 C904.277,747.887 932.308,738.924 957,726.297 C1029.245,689.354 1058.502,676.647 1091,602.297 C1133.812,504.351 1092.773,377.67 1070.937,322.764" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1105" y="589.864" fill="#000" font-size="13" textLength="52" font-family="PingFang SC">再次启用</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-link-type="dependency"><polygon points="1336.643,465.616,1341.007,456.787,1336.847,460.62,1333.013,456.461,1336.643,465.616" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1083.828,318.034 C11